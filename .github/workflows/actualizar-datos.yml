name: Actualizar Datos Bancarios


on:
  # Se reintenta a diario del 10 al 20 de cada mes (ventana en la que la
  # Superintendencia publica el boletin del mes anterior, segun
  # scripts/config.py). Cada corrida sale rapido y sin tocar datos si
  # verificar_publicacion_completa() ya encuentra el periodo objetivo, asi
  # que correr a diario en vez de cada 2 dias solo acorta cuanto tarda en
  # recuperarse de una falla transitoria de la fuente (ej. certificado TLS
  # incompleto del portal, visto del 2026-09-08 al 2026-09-16).
  schedule:
    - cron: '0 13 15,18 * *'→ Runs at 13:00, between day 10 and 20 of the month

  workflow_dispatch:


permissions:
  contents: write


jobs:
  actualizar-datos:
    runs-on: ubuntu-latest
    timeout-minutes: 30


    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4


      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip


      - name: Instalar Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
