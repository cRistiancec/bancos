name: Actualizar Datos Bancarios

on:
  schedule:
    - cron: '0 13 15,18 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-datos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Instalar dependencias
        run: pip install -r requirements-scraping.txt

      - name: Ejecutar actualizacion de datos
        id: ejecutar
        run: python scripts/actualizar_datos.py
        continue-on-error: true

      - name: Verificar resultado
        run: |
          if [ "${{ steps.ejecutar.outcome }}" != "success" ]; then
            echo "El script fallo con errores."
            exit 1
          fi

      - name: Commit y push de datos actualizados
        if: steps.ejecutar.outcome == 'success'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add master_data/
          git diff --staged --quiet || git commit -m "Actualizar datos bancarios $(date +'%Y-%m')"
          git push origin master
